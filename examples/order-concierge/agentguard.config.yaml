# AgentGuard configuration (Order Concierge demo)
agentApiName: Order_Concierge
candidateOrg: ag-dev        # sf alias of the org holding the changed agent (developer environment)
baselineOrg: ag-uat         # sf alias of the org holding the current agent (next pipeline environment)
sourceDir: force-app/main/default
suiteFile: suites/golden.yaml
workDir: .agentguard        # generated suite, spec and reports (git-ignored)
runsDir: runs               # raw live-run output: runs/<label>-<timestamp>/ (keep as evidence)

# agentforce-studio = agents built in the new Agentforce Builder (Agent Script). Beta runner.
# testing-center    = legacy agents (AiEvaluationDefinition).
# Passed to `sf agent test create|run --test-runner`.
runner: agentforce-studio

spec:
  # scorers  = list every scorer in each test case (new-builder style)
  # implicit = topic/action/outcome implied by expected* fields (legacy style)
  # VERIFY with a real `sf agent test create` in your org before relying on results.
  format: scorers
  scorers:
    - topic_sequence_match         # routing (subagent)
    - action_sequence_match        # actions
    - bot_response_rating          # response vs expectedOutcome (also used for safety refusals)
    - output_latency_milliseconds  # informational

generation:
  paraphrases: false        # curated suite only; set true for cheap prefix/suffix paraphrases
  packs: false              # true = add the built-in safety + off-topic packs
  perTopic: { positive: 2, boundary: 2, negative: 1, safety: 1 }
  llm:
    provider: none          # optional / roadmap: "anthropic" + ANTHROPIC_API_KEY writes extra cases
    model: claude-sonnet-4-5
  guardTopic: Off_Topic
  sensitiveActions: [Issue_Refund]
